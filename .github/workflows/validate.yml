name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate SKILL.md frontmatter and marketplace entries
        run: python3 scripts/skills.py validate

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install Node dependencies
        run: npm ci

      # The npx-based marketplace test needs the Node version from .nvmrc.
      - name: Run Python tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Run release config tests
        run: npm test

      - name: Validate Claude Code marketplace manifest
        run: npx -y @anthropic-ai/claude-code@2.1.330 plugin validate .

  # The copied harness tools promise Node 22.0.0; run their tests there. No npm ci: they have no
  # dependencies. The glob is quoted so node expands it, since 22.0 does not expand a bare directory.
  harness-node22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.0.0"

      - name: Run harness tests on Node 22.0.0
        run: node --test "tests/agent-harness/*.test.mjs"
