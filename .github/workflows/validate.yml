name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate SKILL.md frontmatter and marketplace entries
        run: |
          pip install pyyaml
          python3 scripts/skills.py validate

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Claude Code marketplace manifest
        run: npx -y @anthropic-ai/claude-code@2.1.330 plugin validate .
